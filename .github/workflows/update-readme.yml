name: Auto-Update README Index

on:
  push:
    branches:
      - main  # Adjust this if your default branch is named master
  workflow_dispatch: # Allows you to trigger it manually via the GitHub interface if needed

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-python: '3.x'

      - name: Run Readme Generator Script
        run: python .github/scripts/generate_readme.py

      - name: Commit and Push Changes back to Repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          if git diff --cached --quiet; then
            echo "No directory variations detected. Skipping commit."
          else
            git commit -m "chore: auto-regenerate master readme index [skip ci]"
            git push
          fi
