name: Auto-Update README Index

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  refresh-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Script
        run: python .github/scripts/generate_readme.py

      - name: Commit Structural Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          if git diff --cached --quiet; then
            echo "No directory changes detected."
          else
            git commit -m "chore: auto-update index documentation [skip ci]"
            git push
          fi
